[package]
name = "pocket-emulator"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs the macOS Brighter Shores client's arm64 code on Linux with this layer's adapters, for checks without a device"
license = "MIT"

[[bin]]
name = "pocket-emulator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ruzstd = "0.8"
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
webpki-roots = "0.26"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
opt-level = 1
