# A Brighter Pocket Companion release on a v* tag: tools/release/release.sh builds it from this
# commit, signs it with the project's Developer ID, notarizes and staples it, signs the disk
# image for Sparkle and writes the appcast; then the DMG gets a build-provenance attestation
# (anyone can check it was built here, from this tag: gh attestation verify
# Brighter-Pocket-Companion.dmg -R joenye/brighter-pocket) and the GitHub release is made
# with the DMG, appcast.xml and SHA256SUMS. The companion reads
# releases/latest/download/appcast.xml, so publishing the release is what offers the update.
# docs/releasing.md has the secrets and the steps.
#
# The job runs in the `release` environment, which holds every signing secret and is limited
# to v* tags; no one approves a run (Joe, 2026-11-13), so a pushed tag releases at once. Only
# the owner pushes tags. Never add a pull_request(_target) trigger.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_27.1.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # Apple's "Developer ID Certification Authority" (G2) intermediate, which codesign needs when
  # the .p12 holds only the leaf. Pinned by checksum; importing it grants no trust of its own.
  DEVELOPER_ID_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
  DEVELOPER_ID_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write      # gh release create
      id-token: write      # the attestation
      attestations: write  # the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v$version (VERSION)."
            exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated \"## [$version] - YYYY-MM-DD\" section."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Delete it before running again."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The pinned one when the image has it, else the newest it has.
          app="$XCODE_APP"
          [[ -d "$app" ]] || app="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # A throwaway keychain holding only the Developer ID identity, its password random and
      # never leaving this step; deleted at the end.
      - name: Install the signing identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is empty. Add it to the release environment."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$DEVELOPER_ID_CA_URL"
          echo "$DEVELOPER_ID_CA_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          ca_hash=$(printf '%s' "$DEVELOPER_ID_CA_SHA256" | tr '[:lower:]' '[:upper:]')
          if ! security find-certificate -a -Z "$keychain" | grep -qx "SHA-256 hash: $ca_hash"; then
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          fi
          # Without this the first codesign waits on a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          existing=()
          while IFS= read -r k; do
            k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
            [[ -n "$k" ]] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_API_KEY_P8_BASE64" ]]; then
            echo "::error::Secret ASC_API_KEY_P8_BASE64 is empty. Add it to the release environment."
            exit 1
          fi
          key="$RUNNER_TEMP/asc-api-key.p8"
          (umask 077 && printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key")
          echo "ASC_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: RELEASE_TAG="$GITHUB_REF_NAME" tools/release/release.sh

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/Brighter-Pocket-Companion.dmg

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Brighter Pocket Companion $VERSION" --notes-file build/release/notes.md \
            build/release/Brighter-Pocket-Companion.dmg build/release/appcast.xml build/release/SHA256SUMS

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/asc-api-key.p8"
